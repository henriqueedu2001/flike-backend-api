name: flike-demo
services:
  db:
    image: mysql:8.4.8
    environment:
      MYSQL_DATABASE: flike_demo
      MYSQL_USER: flike_demo
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run scripts/demo.sh setup first}
      MYSQL_ROOT_PASSWORD: ${DEMO_DB_ROOT_PASSWORD:?Run scripts/demo.sh setup first}
      TZ: UTC
    ports:
      - "127.0.0.1:55470:3306"
    volumes:
      - demo-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 40
  db-test:
    image: mysql:8.4.8
    profiles: [test]
    environment:
      MYSQL_DATABASE: flike_test
      MYSQL_USER: flike_demo
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run scripts/demo.sh setup first}
      MYSQL_ROOT_PASSWORD: ${DEMO_DB_ROOT_PASSWORD:?Run scripts/demo.sh setup first}
      TZ: UTC
    ports:
      - "127.0.0.1:55471:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 40
volumes:
  demo-data:
